
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MZJ CRM - صندوق الوارد</title>
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <section class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-mark">MZJ</div>
        <div>
          <h1>مجموعة محمد ذعار العجمي للسيارات</h1>
          <p>تسجيل الدخول إلى نظام CRM</p>
        </div>
      </div>
      <form class="login-form" id="loginForm">
        <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required />
        <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" required />
        <div class="login-error" id="loginError"></div>
        <button class="primary" type="submit">تسجيل الدخول</button>
      </form>
    </div>
  </section>

  <div class="app hidden" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-top">
          <div class="logo-box">
            <div class="logo-mark">MZJ</div>
            <div>
              <h1>مجموعة محمد ذعار العجمي للسيارات</h1>
              <div class="status-text" id="connectionStatus">جاري الاتصال...</div>
            </div>
          </div>
          <button class="secondary" id="refreshBtn">تحديث</button>
        </div>
        <div class="nav-tabs">
          <a href="./index.html" class="active">صندوق الوارد</a>
          <a href="./statuses.html" id="statusesLink">حالات العملاء</a>
        </div>
        <div class="user-row">
          <div class="status-text" id="userInfo"></div>
          <button class="secondary" id="logoutBtn">خروج</button>
        </div>
        <select class="dept-select" id="departmentSelect">
          <option value="all">كل الأقسام</option>
          <option value="cash_sales">مبيعات الكاش</option>
          <option value="finance_sales">مبيعات التمويل</option>
          <option value="customer_service">خدمة العملاء</option>
        </select>
      </div>

      <div class="filters">
        <input class="search" id="searchInput" placeholder="بحث باسم العميل أو رقم الجوال..." />
        <div class="platforms" id="platformFilters">
          <button class="chip active" data-platform="all">الكل</button>
          <button class="chip" data-platform="whatsapp">واتساب</button>
          <button class="chip" data-platform="instagram">انستجرام</button>
          <button class="chip" data-platform="facebook">فيسبوك</button>
          <button class="chip" data-platform="tiktok">تيك توك</button>
        </div>
      </div>
      <div class="list" id="conversationList"></div>
    </aside>

    <main class="chat">
      <div class="chat-head">
        <div>
          <button class="secondary hidden" id="backBtn">رجوع</button>
          <div class="chat-title" id="chatTitle">اختر محادثة</div>
          <div class="chat-sub" id="chatSub"></div>
        </div>
      </div>

      <section class="messages" id="messages">
        <div class="empty">اختر محادثة من القائمة</div>
      </section>

      <section class="composer">
        <div class="template-row">
          <select class="search" id="mersalTemplates"><option value="">قوالب مرسال</option></select>
          <select class="search" id="quickReplies"><option value="">رسائل جاهزة</option></select>
        </div>
        <textarea id="replyText" placeholder="اكتب الرد هنا..."></textarea>
        <div class="send-row">
          <span class="status-text" id="sendHint"></span>
          <button class="primary" id="sendBtn">إرسال</button>
        </div>
      </section>
    </main>

    <aside class="customer" id="customerPanel">
      <div class="customer-inner">
        <div class="card">
          <h3>اكتمال ملف العميل</h3>
          <div class="progress"><div class="bar" id="completionBar"></div></div>
          <div class="percent" id="completionText">0% مكتمل</div>
        </div>

        <div class="card">
          <h3>بيانات العميل</h3>
          <form id="customerForm">
            <div class="field">
              <label>حالة العميل</label>
              <select name="clientStatus" id="clientStatusSelect">
                <option value="">اختر حالة العميل</option>
              </select>
            </div>
            <div class="field"><label>اسم العميل</label><input name="customerName" /></div>
            <div class="grid2">
              <div class="field"><label>رقم الجوال</label><input name="phone" /></div>
              <div class="field"><label>العمر</label><input name="age" type="number" /></div>
            </div>
            <div class="grid2">
              <div class="field"><label>الراتب</label><input name="salary" type="number" /></div>
              <div class="field"><label>الالتزام إن وجد</label><input name="obligation" type="number" /></div>
            </div>
            <div class="field"><label>المكان</label><input name="location" /></div>
            <div class="field"><label>نزول الراتب على أي بنك</label><input name="salaryBank" /></div>
            <div class="grid2">
              <div class="field"><label>نوع السيارة</label><input name="carType" /></div>
              <div class="field"><label>الموديل</label><input name="carModel" /></div>
            </div>
            <div class="field"><label>اللون</label><input name="color" /></div>
            <div class="field">
              <label>نوع التمويل</label>
              <select name="financeType">
                <option value="">اختر</option>
                <option value="عام 45%">عام 45%</option>
                <option value="عقاري 65%">عقاري 65%</option>
              </select>
            </div>
            <div class="field"><label>ملاحظات</label><textarea name="notes"></textarea></div>
            <div class="field">
              <label>روابط أو ملاحظات الملفات</label>
              <textarea name="attachmentsNotes" placeholder="اكتب روابط الملفات أو ملاحظات المرفقات هنا"></textarea>
              <div class="status-text" id="attachmentsHint"></div>
            </div>
            <button class="primary" type="submit" style="width:100%">حفظ بيانات العميل</button>
          </form>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, doc, getDoc, onSnapshot, query, orderBy, limit,
      addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCd2paKL200XRdz2SwFEUzAtfg51xWL5QA",
      authDomain: "mzj-lead.firebaseapp.com",
      projectId: "mzj-lead",
      storageBucket: "mzj-lead.firebasestorage.app",
      messagingSenderId: "470098288857",
      appId: "1:470098288857:web:613125cfc1623b08abdec8",
      measurementId: "G-981Z1T6Z91"
    };

    const appFirebase = initializeApp(firebaseConfig);
    try { getAnalytics(appFirebase); } catch(e) {}
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    const DEPARTMENTS = {
      cash_sales:"مبيعات الكاش",
      finance_sales:"مبيعات التمويل",
      customer_service:"خدمة العملاء"
    };

    function el(id){ return document.getElementById(id); }

    function toast(msg){
      const t = el("toast"); t.textContent = msg; t.style.display = "block";
      setTimeout(()=> t.style.display = "none", 2500);
    }

    function showLoginError(msg){
      el("loginError").textContent = msg;
      el("loginError").style.display = "block";
    }

    async function loadUserProfile(user){
      const profileSnap = await getDoc(doc(db, "users", user.uid));
      if(profileSnap.exists()) return profileSnap.data();
      return { email:user.email, name:user.email, role:"user", department:"cash_sales", active:true };
    }

    function isAdminProfile(profile){
      return profile?.role === "admin" || profile?.allDepartments === true;
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[s]));
    }

    const PLATFORM_CONFIG = {
      whatsapp:{ label:"واتساب", conversations:"wa_conversations", outbox:"wa_outbox" },
      instagram:{ label:"انستجرام", conversations:"ig_conversations", outbox:"ig_outbox" },
      facebook:{ label:"فيسبوك", conversations:"fb_conversations", outbox:"fb_outbox" },
      tiktok:{ label:"تيك توك", conversations:"tt_conversations", outbox:"tt_outbox" }
    };

    const CUSTOMER_FIELDS = [
      "customerName","phone","salary","obligation","location","age","salaryBank",
      "carType","carModel","color","notes","attachmentsNotes","financeType"
    ];

    const state = {
      user:null, userProfile:null, isAdmin:false,
      conversations:[], statuses:[], selected:null, selectedPlatform:"all",
      department:"cash_sales", unsubConversations:[], unsubMessages:null, unsubStatuses:null
    };

    const conversationList = el("conversationList");
    const messagesEl = el("messages");
    const form = el("customerForm");

    function departmentLabel(d){ return d === "all" ? "كل الأقسام" : (DEPARTMENTS[d] || d); }
    function platformLabel(p){ return PLATFORM_CONFIG[p]?.label || p; }

    onAuthStateChanged(auth, async (user) => {
      cleanupListeners();
      if(!user){
        state.user = null;
        el("loginScreen").classList.remove("hidden");
        el("app").classList.add("hidden");
        return;
      }

      try{
        state.user = user;
        state.userProfile = await loadUserProfile(user);
        if(state.userProfile.active === false){
          await signOut(auth);
          showLoginError("هذا الحساب غير مفعل.");
          return;
        }

        state.isAdmin = isAdminProfile(state.userProfile);
        applyPermissions();
        el("loginScreen").classList.add("hidden");
        el("app").classList.remove("hidden");
        listenStatuses();
        listenConversations();
      } catch(err){
        console.error(err);
        showLoginError("تعذر تحميل صلاحيات المستخدم.");
      }
    });

    el("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      el("loginError").style.display = "none";
      try{
        await signInWithEmailAndPassword(auth, el("loginEmail").value.trim(), el("loginPassword").value);
      } catch(err){
        console.error(err);
        showLoginError("بيانات الدخول غير صحيحة أو الحساب غير مفعل.");
      }
    };

    el("logoutBtn").onclick = () => signOut(auth);

    function applyPermissions(){
      const departmentSelect = el("departmentSelect");
      if(state.isAdmin){
        departmentSelect.disabled = false;
        state.department = localStorage.getItem("mzj_department") || "all";
      } else {
        const allowedDepartment = state.userProfile?.department || "cash_sales";
        state.department = allowedDepartment;
        departmentSelect.disabled = true;
        [...departmentSelect.options].forEach(opt => opt.hidden = opt.value !== allowedDepartment);
        el("statusesLink").classList.add("hidden");
      }
      departmentSelect.value = state.department;
      el("userInfo").textContent = `${state.userProfile?.name || state.user.email} - ${state.isAdmin ? "إدارة عامة" : departmentLabel(state.department)}`;
    }

    function cleanupListeners(){
      state.unsubConversations.forEach(u => u());
      state.unsubConversations = [];
      if(state.unsubMessages) state.unsubMessages();
      if(state.unsubStatuses) state.unsubStatuses();
      state.unsubMessages = null;
      state.unsubStatuses = null;
      state.conversations = [];
      state.selected = null;
    }

    function listenStatuses(){
      if(state.unsubStatuses) state.unsubStatuses();
      const q = query(collection(db, "client_statuses"), orderBy("sort", "asc"));
      state.unsubStatuses = onSnapshot(q, snap => {
        state.statuses = [];
        snap.forEach(d => state.statuses.push({ id:d.id, ...d.data() }));
        fillStatusDropdown();
      }, err => console.error(err));
    }

    function getSelectedDepartmentForStatus(){
      if(state.selected?.department) return state.selected.department;
      if(state.selected?.customer?.department) return state.selected.customer.department;
      if(state.department !== "all") return state.department;
      return "cash_sales";
    }

    function filteredStatuses(){
      const dept = getSelectedDepartmentForStatus();
      return state.statuses.filter(s => s.active !== false && Array.isArray(s.departments) && s.departments.includes(dept));
    }

    function fillStatusDropdown(currentValue=""){
      const select = el("clientStatusSelect");
      const value = currentValue || select.value;
      select.innerHTML = "";
      select.append(new Option("اختر حالة العميل", ""));
      filteredStatuses().forEach(s => select.append(new Option(s.name, s.name)));
      if(value) select.value = value;
    }

    function tsToDate(v){
      if(!v) return null;
      if(v.toDate) return v.toDate();
      if(typeof v === "number") return new Date(v);
      if(typeof v === "string") return new Date(v);
      return null;
    }

    function formatTime(v){
      const d = tsToDate(v);
      if(!d || isNaN(d)) return "";
      return d.toLocaleString("ar-EG", {hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit"});
    }

    function getCustomerName(c){ return c.customerName || c.customer?.customerName || c.name || c.contactName || c.senderName || c.phone || "عميل بدون اسم"; }
    function getPhone(c){ return c.phone || c.customer?.phone || c.customerPhone || c.from || c.sender || ""; }
    function getLastText(c){ return c.lastMessage || c.lastText || c.preview || c.message || ""; }
    function getClientStatus(c){ return c.clientStatus || c.customer?.clientStatus || ""; }

    function normalizeConversation(platform, id, data){
      return {
        id, platform, ...data,
        customerName:data.customerName || data.customer?.customerName || data.name || data.contactName || data.senderName || "",
        phone:data.phone || data.customer?.phone || data.customerPhone || data.from || data.sender || "",
        clientStatus:data.clientStatus || data.customer?.clientStatus || "",
        department:data.department || data.customer?.department || "",
        updatedAt:data.updatedAt || data.lastMessageAt || data.createdAt || null
      };
    }

    function renderConversations(){
      const search = el("searchInput").value.trim().toLowerCase();
      let items = state.conversations.slice();

      if(state.selectedPlatform !== "all") items = items.filter(c => c.platform === state.selectedPlatform);
      if(!state.isAdmin || state.department !== "all") items = items.filter(c => !c.department || c.department === state.department);
      if(search){
        items = items.filter(c =>
          String(getCustomerName(c)).toLowerCase().includes(search) ||
          String(getPhone(c)).toLowerCase().includes(search) ||
          String(getClientStatus(c)).toLowerCase().includes(search)
        );
      }

      items.sort((a,b) => (tsToDate(b.updatedAt)?.getTime() || 0) - (tsToDate(a.updatedAt)?.getTime() || 0));
      conversationList.innerHTML = items.length ? "" : '<div class="empty">لا توجد محادثات</div>';

      items.forEach(c => {
        const div = document.createElement("div");
        div.className = "conv" + (state.selected?.id === c.id && state.selected?.platform === c.platform ? " active" : "");
        const status = getClientStatus(c);
        div.innerHTML = `
          <div class="row">
            <div class="name">${escapeHtml(getCustomerName(c))}</div>
            <span class="badge ${c.platform}">${platformLabel(c.platform)}</span>
          </div>
          <div class="preview">${escapeHtml(getLastText(c))}</div>
          <div class="row">
            <span class="time">${escapeHtml(getPhone(c))}</span>
            ${status ? `<span class="client-status">${escapeHtml(status)}</span>` : `<span class="time">${formatTime(c.updatedAt)}</span>`}
          </div>`;
        div.onclick = () => selectConversation(c);
        conversationList.appendChild(div);
      });
    }

    function selectConversation(c){
      state.selected = c;
      el("app").classList.add("chat-open");
      el("backBtn").classList.remove("hidden");
      el("chatTitle").textContent = getCustomerName(c);
      el("chatSub").textContent = `${platformLabel(c.platform)} - ${departmentLabel(c.department || state.department)}${getClientStatus(c) ? " - " + getClientStatus(c) : ""}`;
      fillCustomerForm(c.customer || c);
      renderConversations();
      listenMessages(c);
    }

    function listenConversations(){
      state.unsubConversations.forEach(u => u());
      state.unsubConversations = [];
      state.conversations = [];

      Object.entries(PLATFORM_CONFIG).forEach(([platform, cfg]) => {
        const q = query(collection(db, cfg.conversations), orderBy("updatedAt", "desc"), limit(200));
        const unsub = onSnapshot(q, snap => {
          state.conversations = state.conversations.filter(c => c.platform !== platform);
          snap.forEach(d => state.conversations.push(normalizeConversation(platform, d.id, d.data())));
          el("connectionStatus").textContent = "متصل لايف";
          renderConversations();
        }, err => {
          console.error(err);
          el("connectionStatus").textContent = "خطأ في الاتصال";
          if(String(err.code || "").includes("permission")) toast("لا توجد صلاحية قراءة.");
        });
        state.unsubConversations.push(unsub);
      });
    }

    function listenMessages(c){
      if(state.unsubMessages) state.unsubMessages();
      messagesEl.innerHTML = '<div class="empty">جاري التحميل...</div>';

      const cfg = PLATFORM_CONFIG[c.platform];
      const q = query(collection(db, cfg.conversations, c.id, "messages"), orderBy("createdAt", "asc"), limit(300));

      state.unsubMessages = onSnapshot(q, snap => {
        messagesEl.innerHTML = "";
        if(snap.empty){
          messagesEl.innerHTML = '<div class="empty">لا توجد رسائل</div>';
          return;
        }
        snap.forEach(d => {
          const m = d.data();
          const outgoing = ["out","outgoing","agent","sent"].includes(String(m.direction || m.type || "").toLowerCase()) || m.fromAgent === true;
          const div = document.createElement("div");
          div.className = "msg " + (outgoing ? "out" : "in");
          div.innerHTML = `${escapeHtml(m.text || m.body || m.message || "")}<div class="msg-meta">${outgoing ? "أنت" : "العميل"} - ${formatTime(m.createdAt || m.timestamp)}</div>`;
          messagesEl.appendChild(div);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }, err => {
        console.error(err);
        messagesEl.innerHTML = '<div class="empty">تعذر تحميل الرسائل</div>';
      });
    }

    async function sendReply(){
      const c = state.selected;
      const text = el("replyText").value.trim();
      if(!c) return toast("اختر محادثة أولاً");
      if(!text) return toast("اكتب الرسالة أولاً");

      const cfg = PLATFORM_CONFIG[c.platform];
      const dept = c.department || (state.department === "all" ? "cash_sales" : state.department);

      await addDoc(collection(db, cfg.outbox), {
        conversationId:c.id, platform:c.platform, department:dept, to:getPhone(c), text, status:"pending",
        sentByUid:state.user.uid, sentByEmail:state.user.email, createdAt:serverTimestamp()
      });

      await addDoc(collection(db, cfg.conversations, c.id, "messages"), {
        text, direction:"outgoing", fromAgent:true, department:dept,
        sentByUid:state.user.uid, sentByEmail:state.user.email, createdAt:serverTimestamp(), status:"pending"
      });

      await updateDoc(doc(db, cfg.conversations, c.id), { lastMessage:text, department:dept, updatedAt:serverTimestamp() }).catch(()=>{});
      el("replyText").value = "";
      toast("تم الإرسال");
    }

    function fillCustomerForm(data = {}){
      CUSTOMER_FIELDS.forEach(f => {
        const input = form.elements[f];
        if(input && f !== "attachments") input.value = data[f] || "";
      });
      fillStatusDropdown(data.clientStatus || "");
      el("attachmentsHint").textContent = "";
      updateCompletion(data);
    }

    function getFormData(){
      const fd = new FormData(form);
      const data = {};
      CUSTOMER_FIELDS.forEach(f => {
        if(f !== "attachments") data[f] = (fd.get(f) || "").toString().trim();
      });
      data.clientStatus = (fd.get("clientStatus") || "").toString().trim();
      data.department = state.selected?.department || (state.department === "all" ? "cash_sales" : state.department);
      return data;
    }

    function updateCompletion(data){
      const filled = CUSTOMER_FIELDS.filter(f => {
        const v = data[f];
        return Array.isArray(v) ? v.length : String(v || "").trim();
      }).length;
      const percent = Math.round((filled / CUSTOMER_FIELDS.length) * 100);
      el("completionBar").style.width = percent + "%";
      el("completionText").textContent = `${percent}% مكتمل`;
      return percent;
    }

    async function saveCustomer(e){
      e.preventDefault();
      const c = state.selected;
      if(!c) return toast("اختر محادثة أولاً");

      const cfg = PLATFORM_CONFIG[c.platform];
      const data = getFormData();
      const oldStatus = getClientStatus(c);
      data.attachments = [];
      data.profileCompletion = updateCompletion(data);
      data.updatedByUid = state.user.uid;
      data.updatedByEmail = state.user.email;
      data.updatedAt = serverTimestamp();

      await setDoc(doc(db, "customers", `${c.platform}_${c.id}`), { ...data, conversationId:c.id, platform:c.platform }, { merge:true });

      await setDoc(doc(db, cfg.conversations, c.id), {
        customer:data, customerName:data.customerName, phone:data.phone, clientStatus:data.clientStatus,
        department:data.department, profileCompletion:data.profileCompletion, updatedAt:serverTimestamp()
      }, { merge:true });

      if(data.clientStatus && data.clientStatus !== oldStatus){
        await addDoc(collection(db, cfg.conversations, c.id, "status_history"), {
          status:data.clientStatus, note:"", department:data.department,
          createdByUid:state.user.uid, createdByEmail:state.user.email, createdAt:serverTimestamp()
        });
      }

      state.selected = { ...state.selected, ...data, customer:data };
      renderConversations();
      toast("تم الحفظ");
    }

    function fillSelect(select, placeholder, items){
      select.innerHTML = "";
      select.append(new Option(placeholder, ""));
      items.forEach(t => select.append(new Option(t, t)));
    }

    function addTemplateOptions(){
      fillSelect(el("mersalTemplates"), "قوالب مرسال", [
        "مرحباً، نحتاج استكمال بياناتك لإتمام الطلب.",
        "فضلاً أرسل صورة الهوية ورخصة القيادة.",
        "تم استلام طلبك وسيتم التواصل معك قريباً."
      ]);
      fillSelect(el("quickReplies"), "رسائل جاهزة", [
        "أهلاً وسهلاً، كيف نقدر نخدمك؟",
        "ممكن ترسل رقم الجوال للتواصل؟",
        "تم تحويل طلبك للمختص وسيتم الرد عليك."
      ]);
    }

    el("sendBtn").onclick = sendReply;
    form.onsubmit = saveCustomer;
    el("refreshBtn").onclick = listenConversations;
    el("searchInput").oninput = renderConversations;
    el("backBtn").onclick = () => el("app").classList.remove("chat-open");

    el("departmentSelect").onchange = (e) => {
      state.department = e.target.value;
      localStorage.setItem("mzj_department", state.department);
      fillStatusDropdown();
      if(state.selected) el("chatSub").textContent = `${platformLabel(state.selected.platform)} - ${departmentLabel(state.selected.department || state.department)}${getClientStatus(state.selected) ? " - " + getClientStatus(state.selected) : ""}`;
      renderConversations();
    };

    el("platformFilters").onclick = (e) => {
      const btn = e.target.closest(".chip");
      if(!btn) return;
      document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.selectedPlatform = btn.dataset.platform;
      renderConversations();
    };

    el("mersalTemplates").onchange = e => { if(e.target.value) el("replyText").value = e.target.value; };
    el("quickReplies").onchange = e => { if(e.target.value) el("replyText").value = e.target.value; };
    form.oninput = () => updateCompletion(getFormData());

    addTemplateOptions();
  </script>
</body>
</html>
